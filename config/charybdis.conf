CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_POINTING=y
#CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ECO: убираем жёсткие preferred connection parameters.
# Было:
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
#
# Причина: принудительный короткий интервал BLE держит радио активным
# и заметно снижает автономность. Пусть ZMK/BLE сам договаривается
# об интервалах через experimental connection logic.

# Буферы для стабильной работы split + mouse + macros
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_BUF_EVT_RX_COUNT=40
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# Экспериментальное управление BLE-соединениями ZMK
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Передача уровня батареи между половинами/донглом
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Очередь поведений для макросов/мыши
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Имя устройства
CONFIG_BT_DEVICE_NAME_MAX=40
CONFIG_ZMK_KEYBOARD_NAME="Charybdis46_Black4"
