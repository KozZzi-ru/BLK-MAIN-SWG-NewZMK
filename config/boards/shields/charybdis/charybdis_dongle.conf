# Конфигурация донгла (центр)

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Поддержка мыши и ввода
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Увеличенная мощность BLE передатчика для стабильности
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ECO: deep sleep включаем только для донгла.
# Донгл обычно питается от USB, поэтому сон безопасен для UX:
# он может проснуться по активности USB/BLE, когда пользователь возвращается.
CONFIG_ZMK_SLEEP=y

# Глубокий сон после 15 минут бездействия
# 900000 ms = 15 минут
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
