# Конфигурация правой половины (периферия с PMW3610)

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Отключаем NFC-пины как GPIO: небольшая, но полезная экономия на nRF52840
CONFIG_NFCT_PINS_AS_GPIOS=y

# Внешнее питание для периферии/трекбола
CONFIG_ZMK_EXT_POWER=y

# Драйвер трекбола PMW3610
CONFIG_PMW3610_ALT=y

# Фикс рывков: увеличиваем стек системной очереди для SPI + BLE split-forward
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ECO: deep sleep для правой половины отключён.
# Это важно из-за PMW3610 и split-forward: пробуждение из глубокого сна
# может давать пропуск первых движений трекбола или микро-лаги.
CONFIG_ZMK_SLEEP=n

# Таймауты энергосбережения можно настроить через device tree
# или использовать настройки по умолчанию от badjeff драйвера

# Опционально: минимальный интервал репортинга (12мс по умолчанию)
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# Для отладки (если нужно)
# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y

# Если потребуется дополнительная задержка при инициализации
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300
